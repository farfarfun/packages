name: build

on:
  # 各项目发完 release 后打过来的通知，正常路径。
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packages.toml
      - scripts/**
      - site/**
      - .github/workflows/build.yml
  # 兜底。某个项目的 dispatch 没打过来（token 过期、workflow 改坏了），第二天
  # 这一跑也会把它收进来——否则「发版了但 apt 里没有」要等到有人报错才发现。
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# 整个仓库每次都是全量重建，两次并行跑会互相覆盖 Pages 产物。不取消进行中的那
# 次：它可能正带着另一个项目刚发的包，取消了那个包这一轮就没了。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.config.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - id: config
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::warning::没配 APT_GPG_PRIVATE_KEY，跳过发布。"
          fi

      - name: 装工具
        if: steps.config.outputs.signed == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev

      - id: key
        name: 导入签名密钥
        if: steps.config.outputs.signed == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          fpr="$(printf '%s' "$APT_GPG_PRIVATE_KEY" \
            | gpg --batch --with-colons --import-options show-only --import 2>/dev/null \
            | awk -F: '$1 == "fpr" {print $10; exit}')"
          [ -n "$fpr" ] || { echo "密钥读不出指纹" >&2; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$fpr" >>"$GITHUB_OUTPUT"

      - name: 按清单收 .deb
        if: steps.config.outputs.signed == 'true'
        env:
          # 只读公开 release，默认 token 就够。
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collect-debs.sh packages.toml debs

      - name: 组装并签名
        if: steps.config.outputs.signed == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: bash scripts/build-deb-repo.sh debs public/deb "${{ steps.key.outputs.fingerprint }}"

      - name: 放公钥和说明页
        if: steps.config.outputs.signed == 'true'
        run: |
          set -euo pipefail
          cp site/index.html public/index.html
          # 公钥放站点根上，不放 deb/ 下面：以后再加 rpm 源的话用的是同一把钥匙。
          gpg --batch --export "${{ steps.key.outputs.fingerprint }}" >public/farfarfun.gpg
          gpg --batch --armor --export "${{ steps.key.outputs.fingerprint }}" >public/farfarfun.asc
          echo "=== 索引里有这些包 ==="
          grep -E '^(Package|Version|Architecture):' public/deb/dists/stable/main/binary-amd64/Packages

      - uses: actions/upload-pages-artifact@v3
        if: steps.config.outputs.signed == 'true'
        with:
          path: public

  # 这个仓库自己就是 Homebrew tap：根目录的 Formula/ 由同一张清单生成，提交回
  # 自己的 master。brew 认 Formula/ 这个目录名，不要求仓库叫 homebrew-*——代价是
  # tap 的时候得把 URL 写出来（见 README）。
  brew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render-formula.py packages.toml Formula

      # 不会把自己再触发一遍：GITHUB_TOKEN 推的提交不触发 workflow，而且上面的
      # push 过滤器里没有 Formula/。两道保险。
      - name: 提交 formula
        run: |
          set -euo pipefail
          git add Formula
          if git diff --cached --quiet; then
            echo "formula 没变化。"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: 按 packages.toml 更新 formula"
          # 同一时刻可能有另一次构建刚推过，rebase 一下再推。
          git pull --rebase --autostash
          git push

  # tap 的地址形式是非约定的（带 URL），而这正是这次改动唯一的风险点——真跑一遍
  # brew tap + brew install，而不是只看 formula 文件长得对不对。
  verify-brew:
    needs: brew
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 真 tap 一遍再装
        run: |
          set -euxo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap farfarfun/packages https://github.com/farfarfun/packages

          # Homebrew 6.0 起第三方 tap 默认不可信，不 trust 的话连 brew info 都直接
          # 拒绝加载。写全名 `brew install a/b/c` 会顺带只信任那一个 formula——所以
          # 「写全名能装、裸名字不能」，很容易误以为是裸名字的问题。trust 整个 tap：
          # 这个仓库本来就是用来一次管全组织的包的，逐个信任等于每加一个包再来一遍。
          brew trust farfarfun/packages

          # 裸名字装。tap 过之后 brew 在所有已 tap 的仓库里找，不用写全路径——
          # 除非哪天 homebrew-core 里出现同名的，那时 core 优先，这一步就会红，
          # 正好提醒我们该改文档了。
          # 不要 `| head`：会给 brew 一个 broken pipe，pipefail 下整步就红了。
          brew info fundeploy | grep -F 'farfarfun/packages/fundeploy: stable'
          brew install fundeploy 2>&1 | tee /tmp/out
          # 确认装的真是本 tap 的那份，而不是碰巧撞上了别处的同名包。
          grep -F 'Installing fundeploy from farfarfun/packages' /tmp/out
          fundeploy --version
          fundeploy list >/dev/null

  deploy:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 真照着 README 的说明加一遍源再装。索引算错、签名不对、架构漏了，都是
      # 到这一步才看得出来——而用户碰到的正是这一步。
      - name: 加源装一遍
        run: |
          set -eux
          base=https://farfarfun.github.io/packages
          # Pages 部署到边缘生效有几十秒延迟，重试几次再判失败。
          for i in 1 2 3 4 5 6; do
            curl -fsSL "$base/farfarfun.gpg" -o /tmp/k.gpg && break
            sleep 10
          done
          sudo install -m 0644 /tmp/k.gpg /usr/share/keyrings/farfarfun.gpg
          echo "deb [signed-by=/usr/share/keyrings/farfarfun.gpg] $base/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/farfarfun.list
          sudo apt-get update
          sudo apt-get install -y fundeploy
          fundeploy --version

      # 留多版的全部理由就是能回退。只装最新版的话，索引漏掉老版本这种故障是看
      # 不出来的——装得上，只是退不回去。
      - name: 退回上一版再装一遍
        run: |
          set -eux
          apt-cache madison fundeploy
          old="$(apt-cache madison fundeploy | awk '{print $3}' | sort -V | head -1)"
          sudo apt-get install -y --allow-downgrades "fundeploy=${old}"
          fundeploy --version | grep -F "$old"
