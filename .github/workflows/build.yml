name: build

on:
  # 各项目发完 release 后打过来的通知，正常路径。
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packages.toml
      - scripts/**
      - tests/**
      - site/**
      - .github/workflows/build.yml
  # 定时扫。对不发 dispatch 的项目（funget 就是，它刻意不存 PAT）这是唯一的发现
  # 途径，所以频率按「发版后最多等多久能 apt install 到」定，不是按「兜底」定 ——
  # 两小时一次，最坏情况两小时。再密没意义：全量重建本身只要几分钟，但 Pages
  # 的部署是有配额的，而且这里拉的是各项目 Release，不是什么会秒变的东西。
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

# 整个仓库每次都是全量重建，两次并行跑会互相覆盖 Pages 产物。不取消进行中的那
# 次：它可能正带着另一个项目刚发的包，取消了那个包这一轮就没了。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.config.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - id: config
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::warning::没配 APT_GPG_PRIVATE_KEY，跳过发布。"
          fi

      - name: 装工具
        if: steps.config.outputs.signed == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev fonts-noto-cjk

      - name: Test site and release links
        run: python3 -m unittest discover -s tests

      - id: key
        name: 导入签名密钥
        if: steps.config.outputs.signed == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          fpr="$(printf '%s' "$APT_GPG_PRIVATE_KEY" \
            | gpg --batch --with-colons --import-options show-only --import 2>/dev/null \
            | awk -F: '$1 == "fpr" {print $10; exit}')"
          [ -n "$fpr" ] || { echo "密钥读不出指纹" >&2; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$fpr" >>"$GITHUB_OUTPUT"

      - name: 按清单收 .deb
        if: steps.config.outputs.signed == 'true'
        env:
          # 只读公开 release，默认 token 就够。
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collect-debs.sh packages.toml debs

      - name: 组装并签名
        if: steps.config.outputs.signed == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: bash scripts/build-deb-repo.sh debs public/deb "${{ steps.key.outputs.fingerprint }}" packages.toml

      - name: 放公钥
        if: steps.config.outputs.signed == 'true'
        run: |
          set -euo pipefail
          mkdir -p public
          # 公钥放站点根上，不放 deb/ 下面：以后再加 rpm 源的话用的是同一把钥匙。
          gpg --batch --export "${{ steps.key.outputs.fingerprint }}" >public/farfarfun.gpg
          gpg --batch --armor --export "${{ steps.key.outputs.fingerprint }}" >public/farfarfun.asc
          echo "=== 索引里有这些包 ==="
          grep -E '^(Package|Version|Architecture):' public/deb/dists/stable/main/binary-amd64/Packages

      # 渲染站点不用 GPG，没配 secret 时也检查模板；PR 的离线检查在 check.yml。
      # 上传 Pages 产物只在 signed 时跑。
      #
      # 要在索引生成之后：版本一节读的是刚扫出来的 Packages，它才是 apt 真能装到的
      # 那几版。索引不在（上面跳过了）时渲染器自己退化成按 Release 列。
      - name: 渲染站点
        env:
          # 只读公开 release 和 CHANGELOG.md，默认 token 就够。
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/render-site.py site public \
            --packages packages.toml \
            --deb public/deb \
            --fingerprint "${{ steps.key.outputs.fingerprint }}"

      - name: Check screenshot gallery in Chrome
        run: |
          node --check site/assets/app.js
          python3 -m pip install playwright==1.55.0
          python3 tests/browser_gallery.py public

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-screenshots
          path: /tmp/gallery-screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: steps.config.outputs.signed == 'true'
        with:
          path: public

  # 这个仓库自己就是 Homebrew tap：根目录的 Formula/ 和 Casks/ 由同一张清单生成，
  # 提交回自己的 master。brew 认这两个目录名，不要求仓库叫 homebrew-*——代价是
  # tap 的时候得把 URL 写出来（见 README）。
  #
  # 两种产物在同一个 job 里渲染、一次提交。分成两个 job 的话它们会同时往 master
  # 推，变成靠 `git pull --rebase` 赛跑，而分开的好处只是少一次 checkout。
  brew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 formula 和 cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/render-formula.py packages.toml Formula
          python3 scripts/render-cask.py packages.toml Casks

      # 不会把自己再触发一遍：GITHUB_TOKEN 推的提交不触发 workflow，而且上面的
      # push 过滤器里没有 Formula/ 和 Casks/。两道保险。
      - name: 提交 formula 和 cask
        run: |
          set -euo pipefail
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "formula 和 cask 都没变化。"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: 按 packages.toml 更新 formula 和 cask"
          # 同一时刻可能有另一次构建刚推过，rebase 一下再推。
          git pull --rebase --autostash
          git push

  # 上面那条「不触发 workflow」的另一面：sync-gitee 的 push 触发器也收不到那一下。
  # formula 基本只由 brew job 改，不补一刀的话 Gitee 上那份 tap 会一直停在最后一次
  # 人工提交——而它正是给 GitHub 连不上的人用的，停了这边谁也看不见。
  # workflow_dispatch 是 GITHUB_TOKEN 那条限制的明文例外，打得动。
  #
  # 不判「这次改没改」：那样要等到下次发版才第一次走到这行，等于留一条到时候才知道
  # 通不通的路。每轮都打的话它跟着定时构建两小时跑一遍，哪天权限或命令不对当场就是
  # 红的。sync-gitee 本身是幂等的，没变化时它自己就什么都不做。
  #
  # 打完要等它跑完：每日 verify-brew-gitee 与本 workflow 共用 concurrency group，
  # 只有这次同步完成后才会从 Gitee tap 读取 formula。
  sync:
    needs: brew
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: 打一下 sync-gitee 并等它跑完
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 先记时间再打：dispatch 不回 run id，只能按「晚于这一刻的那次
          # workflow_dispatch」去认。同名 workflow 的 run 是串着来的（它自己有
          # concurrency group），不会同时冒出两次认错人。
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run sync-gitee.yml --repo "$REPO"
          id=""
          for _ in $(seq 24); do
            sleep 5
            # gh 按新到旧列，取最老的那个才是我们刚打的（万一期间又被打了一次）。
            id="$(gh run list --repo "$REPO" --workflow sync-gitee.yml \
                    --event workflow_dispatch --limit 10 \
                    --json databaseId,createdAt \
                    --jq "[.[] | select(.createdAt >= \"$since\")] | last | .databaseId // empty")"
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || {
            echo "::error::打了 sync-gitee，但两分钟内没见到对应的 run。"
            exit 1
          }
          echo "sync-gitee run: $id"
          gh run watch "$id" --repo "$REPO" --exit-status

  # tap 的地址形式是非约定的（带 URL），而这正是这次改动唯一的风险点——真跑一遍
  # brew tap + brew install，而不是只看 formula 文件长得对不对。
  verify-brew:
    needs: brew
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 取 master 的当下，不是触发这次构建的那个 SHA：formula 是上面 brew job 刚推
      # 上去的，按触发 SHA checkout 拿到的是上一版，下面那条 diff 就变成拿旧文件比
      # 旧文件了。
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 真 tap 一遍再装
        run: |
          set -euxo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap farfarfun/packages https://github.com/farfarfun/packages

          # Homebrew 6.0 起第三方 tap 默认不可信，不 trust 的话连 brew info 都直接
          # 拒绝加载。写全名 `brew install a/b/c` 会顺带只信任那一个 formula——所以
          # 「写全名能装、裸名字不能」，很容易误以为是裸名字的问题。trust 整个 tap：
          # 这个仓库本来就是用来一次管全组织的包的，逐个信任等于每加一个包再来一遍。
          brew trust farfarfun/packages

          # tap 下来的必须就是这一轮推上去的那份。少了这一步，tap 到一个落后的远端
          # 照样装得上、照样绿，而验的是上一版——这次生成的东西等于没验。
          diff -r Formula "$(brew --repository farfarfun/packages)/Formula"

          # 按 packages.toml 遍历，不写死包名——加一个项目不用回来改这里。
          # 用 mapfile 而不是 `while read ... <<<`：brew 会把 stdin 剩下的内容吃掉，
          # 那样循环只跑第一个包就 EOF 退出，而且是绿的——第二个包等于没验。
          mapfile -t rows < <(python3 scripts/list-packages.py packages.toml --brew)
          printf '%s\n' "${rows[@]}"
          for row in "${rows[@]}"; do
            pkg="${row%%$'\t'*}"
            bin="${row##*$'\t'}"
            # 裸名字装。tap 过之后 brew 在所有已 tap 的仓库里找，不用写全路径——
            # 除非哪天 homebrew-core 里出现同名的，那时 core 优先，这一步就会红，
            # 正好提醒我们该改文档了。
            # 问 json 不问人看的输出：`==>` 那些标题走的是 stderr，还带 ANSI 颜色，
            # grep 它纯属给自己找事。
            test "$(brew info --json=v2 "$pkg" | jq -r '.formulae[0].tap')" \
              = farfarfun/packages
            brew install "$pkg" 2>&1 | tee /tmp/out
            # 确认装的真是本 tap 的那份，而不是碰巧撞上了别处的同名包。
            grep -F "Installing ${pkg} from farfarfun/packages" /tmp/out
            "$bin" --version
            # packages.toml 里的 checks 被渲染进了 formula 的 test 块，而在这之前
            # 没有任何一步会去跑它——配了等于没配。brew test 是唯一会执行它的入口。
            brew test "$pkg"
          done

  # linuxbrew 压根不读 cask，上面那个 job 覆盖不到它——它按 `--brew` 遍历，cask
  # 天然不在里面。cask 渲染得对不对、tap 解析得到、裸名字能装，只有 macOS runner
  # 上能验，所以这是整个仓库唯一一个 macOS job。
  #
  # 不验「GitHub 连不上也能装」：cask 的 url 不认 mirror，那条承诺在 cask 上压根
  # 不成立（见 render-cask.py 的头注释），没有可验的东西。
  verify-cask:
    needs: brew
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      # 取 master 的当下，不是触发这次构建的那个 SHA：cask 是上面 brew job 刚推
      # 上去的，理由同 verify-brew。
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 真 tap 一遍再装
        run: |
          set -euxo pipefail
          brew tap farfarfun/packages https://github.com/farfarfun/packages
          brew trust farfarfun/packages

          # tap 下来的必须就是这一轮推上去的那份，否则装的是上一版 cask 而报绿。
          diff -r Casks "$(brew --repository farfarfun/packages)/Casks"

          # 不用 mapfile：macOS 自带的 /bin/bash 是 3.2，没有这个内建命令。从 fd 3
          # 读而不是 stdin——brew 会把 stdin 剩下的内容吃掉，那样循环只跑第一个包
          # 就 EOF 退出，而且是绿的（verify 和 verify-brew 都踩过这个）。
          python3 scripts/list-packages.py packages.toml --cask >/tmp/casks
          cat /tmp/casks
          while IFS=$'\t' read -r pkg app <&3; do
            # 裸名字就解析到本 tap 的 cask，不写 --cask：tap 里没有同名 formula，
            # 哪天有了这一步会先红，正好提醒该改文档了。
            test "$(brew info --json=v2 "$pkg" | jq -r '.casks[0].tap')" \
              = farfarfun/packages
            brew install "$pkg"
            test -d "/Applications/${app}.app"

            # 装进去的就是 cask 声明的那一版。GUI 应用没有 --version 可问，所以读
            # .app 自己的 Info.plist——那是产物里的事实，而不是拿 brew 的元数据跟
            # 自己对账。
            want="$(brew info --json=v2 "$pkg" | jq -r '.casks[0].version')"
            got="$(/usr/libexec/PlistBuddy -c \
              'Print :CFBundleShortVersionString' \
              "/Applications/${app}.app/Contents/Info.plist")"
            test "$got" = "$want"

            brew uninstall --cask "$pkg"
          done 3</tmp/casks

  deploy:
    needs: [build, brew]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 真照着 README 的说明加一遍源再装。索引算错、签名不对、架构漏了，都是
      # 到这一步才看得出来——而用户碰到的正是这一步。
      - name: 加源装一遍
        run: |
          set -eux
          base=https://farfarfun.github.io/packages
          # Pages 部署到边缘生效有几十秒延迟，重试几次再判失败。
          for _ in 1 2 3 4 5 6; do
            curl -fsSL "$base/farfarfun.gpg" -o /tmp/k.gpg && break
            sleep 10
          done
          sudo install -m 0644 /tmp/k.gpg /usr/share/keyrings/farfarfun.gpg
          echo "deb [signed-by=/usr/share/keyrings/farfarfun.gpg] $base/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/farfarfun.list
          sudo apt-get update
          # 按 packages.toml 遍历。apt 收所有项目，不只是配了 brew 的那些。
          python3 scripts/list-packages.py packages.toml | tee /tmp/pkgs
          # 不用 `while read`：循环体里的命令会跟它抢 stdin，吃掉剩下的行之后循环
          # 提前结束，而且一声不响地绿着。verify-brew 就是这么漏掉第二个包的。
          mapfile -t rows </tmp/pkgs
          for row in "${rows[@]}"; do
            pkg="${row%%$'\t'*}"
            bin="${row##*$'\t'}"
            sudo apt-get install -y "$pkg"
            if [ "$bin" = - ]; then
              # 第二列是 `-` 的包没有能在无头 runner 上跑的入口（packages.toml 里的
              # cli = false）。退一步验 .desktop 的 Exec 指到的东西在 PATH 上：装歪了
              # ——postinst 的软链没建、或者名字跟 .desktop 里写的不是一个——在这儿红。
              desktops="$(dpkg -L "$pkg" | grep '^/usr/share/applications/.*\.desktop$' || true)"
              [ -n "$desktops" ]
              for d in $desktops; do
                command -v "$(awk -F= '/^Exec=/{print $2; exit}' "$d" | awk '{print $1}')"
              done
            else
              "$bin" --version
            fi
          done

      # 留多版的全部理由就是能回退。只装最新版的话，索引漏掉老版本这种故障是看
      # 不出来的——装得上，只是退不回去。
      - name: 退回上一版再装一遍
        run: |
          set -eux
          mapfile -t rows </tmp/pkgs
          for row in "${rows[@]}"; do
            pkg="${row%%$'\t'*}"
            bin="${row##*$'\t'}"
            apt-cache madison "$pkg"
            # 刚接进来的项目索引里可能只有一版（min_version 挡掉了更早的），这时
            # 最老的就是最新的，装一遍不算回退但也不该红。
            old="$(apt-cache madison "$pkg" | awk '{print $3}' | sort -V | head -1)"
            sudo apt-get install -y --allow-downgrades "${pkg}=${old}"
            if [ "$bin" = - ]; then
              test "$(dpkg-query -W -f='${Version}' "$pkg")" = "$old"
            else
              "$bin" --version | grep -F "$old"
            fi
          done
