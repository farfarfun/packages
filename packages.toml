# 收进 farfarfun 包仓库的项目。
#
# 每个条目是一个 GitHub 仓库。它 release 附件里的 `.deb` 会被编进 APT 索引，
# 带 `[source.brew]` 的还会生成一份 Homebrew formula 推到 farfarfun/homebrew-tap。
# 加一个新项目就是在这儿加几行，项目仓库本身不用动。
#
# 附件名按约定认：`<包名>-<target>.tar.gz` 和 `<包名>_<版本>_<架构>.deb`，包名取
# 仓库名。各项目的 release workflow 本来就是一个模子出来的，不再单独配一遍。
#
# 为什么不把 .deb 提交进 git：GitHub Pages 的站点上限是 1 GB，而二进制只增不减，
# 真到了那天想清理得改写历史。各项目的 Release 本来就是事实来源，这里只记
# 「收谁的、留几版」，pool 每次按这张表重新拼。

[[source]]
repo = "farfarfun/fundeploy"
# 索引里保留最近几个版本。留多于一个是为了能 `apt install fundeploy=0.3.0`
# 回退——只留最新的话，装坏了就没有退路。
keep = 3
# 0.3.0 之前是 Bash 版，deb 是 Architecture: all 并且 Depends 一堆东西，装出来是
# 一棵脚本树而不是一个二进制——跟现在是两个完全不同的东西，不该在同一个包名下
# 让人 `apt install fundeploy=0.1.17` 装到。0.1.15 那一版包名还叫 nltdeploy，
# 收进来等于凭空多出一个谁也不认识的包。
min_version = "0.3.0"

# 有这一节才生成 formula。desc 用英文：brew 那边搜索和 `brew desc` 都读它。
[source.brew]
desc = "Manage development toolchains, local services and package mirrors from one CLI"
# brew test 跑的额外断言：`[参数, 输出里该出现的字串]`。
# `--version` 对版本号的断言是默认就有的，不用写在这儿。
checks = [["list", "service"]]
