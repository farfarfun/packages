# 收进 farfarfun 包仓库的项目。
#
# 每个条目是一个 GitHub 仓库。它 release 附件里的 `.deb` 会被编进 APT 索引，带
# `[source.brew]` 的还会生成一份 Homebrew formula、带 `[source.cask]` 的生成一份
# cask，都提交回本仓库的 Formula/ 和 Casks/（这个仓库同时就是 tap）。加一个新项目
# 就是在这儿加几行，项目仓库本身不用动 —— CI 的几个装机验证也是按这张表遍历的，
# 不用回去改 workflow。
#
# 附件名按约定认，包名取仓库名：
#   formula  `<包名>-<target>.tar.gz`
#   cask     `<应用名>-<版本>-macos-<架构>.dmg`（前缀是显示名，见下面 funclash）
#   apt      `<包名>_<版本>_<架构>.deb`
#   utools   `<包名>-<版本>.upx`
# 各项目的 release workflow 本来就是一个模子出来的，不再单独配一遍。
#
# `[source.utools]` 和前三个不是一类东西：它不进 APT 索引、不生成 formula、CI 也装不了
# 它（uTools 是个带界面的宿主程序，无头 runner 上没有「装一个插件」这回事）。它在这张
# 表里只为了一件事 —— 让这些插件也有一页中英双语的说明页，跟着 Release 自动更新。
#
# 为什么不把 .deb 提交进 git：GitHub Pages 的站点上限是 1 GB，而二进制只增不减，
# 真到了那天想清理得改写历史。各项目的 Release 本来就是事实来源，这里只记
# 「收谁的、留几版」，pool 每次按这张表重新拼。

[[source]]
repo = "farfarfun/fundeploy"
# 索引里保留最近几个版本。留多于一个是为了能 `apt install fundeploy=0.3.0`
# 回退——只留最新的话，装坏了就没有退路。
keep = 3
# 0.3.0 之前是 Bash 版，deb 是 Architecture: all 并且 Depends 一堆东西，装出来是
# 一棵脚本树而不是一个二进制——跟现在是两个完全不同的东西，不该在同一个包名下
# 让人 `apt install fundeploy=0.1.17` 装到。0.1.15 那一版包名还叫 nltdeploy，
# 收进来等于凭空多出一个谁也不认识的包。
min_version = "0.3.0"

# 有这一节才生成 formula。desc 用英文：brew 那边搜索和 `brew desc` 都读它。
[source.brew]
desc = "Manage development toolchains, local services and package mirrors from one CLI"
# brew test 跑的额外断言：`[参数, 输出里该出现的字串]`。
# `--version` 对版本号的断言是默认就有的，不用写在这儿。
# 断言的是分节标题而不是某个具体服务名：服务清单会增减，标题不会。原来写的是
# 英文 `service`，而 `fundeploy list` 打的是中文 —— 那条断言从来没通过过，只是
# 在 verify-brew 开始跑 brew test 之前没人执行它。
checks = [["list", "服务"]]

[[source]]
repo = "farfarfun/funget"
keep = 3
# 1.1.72 及更早的 release 里没有 .deb（那时还没做这条渠道）。collect-debs.sh 对
# 「没有 .deb」是容忍的，写下限只是为了别让 keep=3 把名额占在没有包的版本上。
min_version = "1.1.73"

[source.brew]
desc = "HTTP file transfer tool with ranged concurrency and resume"
# --help 里有 download 这个子命令。funget 没有 fundeploy 那种能空跑的子命令：
# download / upload / info 全要一个真 URL，不该让 brew test 依赖网络。
checks = [["--help", "download"]]

[[source]]
repo = "farfarfun/funbuild"
keep = 3
# 1.6.104 及更早的 release 里没有二进制附件：那时只发 PyPI wheel（里面装的是同一个
# 二进制）和 crate，apt / brew 这两条渠道是 1.6.105 才接的。
min_version = "1.6.105"

[source.brew]
desc = "One-command release pipeline for Python, frontend, Flutter and Rust repos"
# 只断言 --help：funbuild 的每条子命令都要先找到 git 仓库根，`--help` 是唯一一个
# 不触发仓库探测的入口（探测是延迟到真正执行子命令时才做的），不该让 brew test
# 去造一个仓库。
checks = [["--help", "build"]]

[[source]]
repo = "farfarfun/funclash"
# 一个 .deb 45 MB，两个架构，所以 keep=2 就占了 180 MB，而 Pages 整站上限 1 GB。
# 留两版而不是三版：能回退是留多版的全部理由，两版就够用，第三版只是再占 90 MB。
# funclash 自己的 README 也是按「apt 保留最近两版」写给用户的。
keep = 2
# 改名前的 tag（v0.9.0 及更早）万一被推回这个仓库，那些 release 里的 .deb 叫
# `FlClash-<版本>-linux-<架构>.deb`，而 dpkg-scanpackages 的 glob 只认
# `<包名>_<版本>_<架构>.deb` —— 它扫不到却一声不响，然后 build-deb-repo.sh 的
# 条数核对会判整个组织的发布失败。写个下限把那些 tag 挡在外面。
min_version = "1.0.0"
# 没有能在 CI 里跑的命令行入口。postinst 往 /usr/bin 软链的 FunClash 是 Flutter
# 的窗口程序，它的 main() 只把 argv 交给 URL scheme 处理（funclash 的
# lib/main.dart），不认 --version，在无头 runner 上跑它只会卡住。verify 对
# cli = false 的包改成查 .desktop 的 Exec 解析得到、版本从 dpkg 问。
cli = false

# cask 而不是 [source.brew]：render-formula.py 的 bin.install 要一个
# `<包名>-<target>.tar.gz` 里的单个二进制，而这是个发 DMG 的桌面应用，没有那个
# 东西。两种产物由两个渲染器分别生成，见 scripts/render-cask.py 的头注释。
[source.cask]
# 应用的显示名：既是 DMG 附件名的前缀，也是装进 /Applications 的 .app 名。跟包名
# 不一样 —— 包名必须是小写的 funclash（Debian 对 package_name 的要求），而应用
# 在所有可见的地方都叫 FunClash。
app = "FunClash"
desc = "Multi-platform proxy client based on mihomo (Clash.Meta)"
# funclash 的 README 写的是 macOS 12 及以上。
min_macos = "monterey"
# brew uninstall --zap 要清的用户数据按这个 bundle id 拼。应用没开沙箱
# （macos/Runner/Release.entitlements 里没有 app-sandbox），所以数据直接落在
# ~/Library 下，不在 Containers 里。macOS 上没有常驻的特权 helper 要清：提权走的
# 是一次性的 osascript "with administrator privileges"，不装 launchd daemon。
bundle_id = "com.farfarfun.funclash"

[[source]]
repo = "farfarfun-game/fungame-client"
name = "fungame"
keep = 2
min_version = "0.1.1"
cli = false

[source.cask]
app = "FunGame"
desc = "Desktop shell for FunGame that opens a configurable server address"
min_macos = "monterey"
bundle_id = "com.farfarfun.fungame"

[[source]]
repo = "farfarfun/funread-web"
# 仓库名带 -web 是因为它同时是 npm 包 @farfarfun/funread-web 的源码，而它打出来的
# 桌面客户端对用户就叫 funread：deb 的 Package 字段、Tauri 的 productName、装进
# /Applications 的 .app 名全是 funread。这里跟着产物走，不跟仓库名走。
name = "funread"
keep = 3
# 1.1.127 是第一个能收的版本，1.1.126 也不行 —— 它同一次 release 里的
# `funread-light-v1.1.126-linux.deb` 不符合 `<包名>_<版本>_<架构>.deb`，而
# collect-debs.sh 是按 `*.deb` 收整个 release 的，dpkg-scanpackages 会把它静默
# 跳过，于是 build-deb-repo.sh 的条数核对判整次构建失败（pool 里 9 个、索引里
# 8 条）。更早的版本则是 macOS 只出一个架构，cask 整段不生成。
# 两个毛病都在 funread-web 的 1.1.127 修了。
min_version = "1.1.127"
# 装出来是 Tauri 的窗口程序，无头 runner 上跑它只会卡住，和 funclash 同理。
cli = false

# 同一次 release 里还有 funread-light（另一套壳：不打包 Web 资源，启动时问服务器
# 地址）。它的 deb 会跟着 `--pattern '*.deb'` 一起进 APT 源 —— Package 字段是
# funread-light，和 funread 不撞，`apt install funread-light` 装得到。但它不单列
# 一个 [[source]]：这张表的单位是仓库，一个仓库只能有一个条目。代价是它没有站点
# 页面、没有 cask，DMG 只能从 Release 下。真要给它这些，得先拆仓库。

[source.cask]
# 显示名正好等于包名（Tauri 的 productName 就是小写的 funread），不像 FunClash
# 那样两者不同。但这个字段仍然要写：render-cask.py 按它拼 DMG 附件名。
app = "funread"
desc = "Self-hosted reader for novels and RSS feeds"
# **故意不写 min_macos。** tauri.conf.json 里的 minimumSystemVersion 是 10.15，而
# `depends_on macos: :catalina` 这个符号已经被 Homebrew 禁掉了（"Calling
# `depends_on macos: :catalina` is disabled! There is no replacement."，整个 cask
# 直接加载失败，brew info 都读不出来）。往上抬到 :monterey 又是撒谎 —— 这个应用在
# Big Sur 上跑得动。
#
# 结论是这条约束本来就没用：能装得动新版 Homebrew 的系统全都高于 10.15，写不写
# 都拦不到人。funclash 那边写了 :monterey 是因为它自己的 README 就要求 macOS 12，
# 那是个真实存在的下限。
bundle_id = "com.farfarfun.funread"

# ⚠️ 这一节是注释掉的，解开之前先读完这段。
#
# 它曾经以活动条目的形式合进 master（#6），而它自己的注释当时就写着「还不能合」。
# 结果从那次合并起，verify / verify-brew / verify-brew-gitee 三个 job 一直红到
# 现在 —— 核心库 funread 是个纯 Python 库（PyPI 上的 funread，pyproject.toml 里
# 没有 [project.scripts]），GitHub 上一个 release 都没有，而这三个 job 都按这张表
# 遍历装包。注释掉而不是删掉：文案和判据都还成立，只是要等它真有东西可装。
#
# 另外包名换了。`funread` 给了上面的桌面客户端 —— 对最终用户，`apt install funread`
# 该装到那个能打开读书的应用；这个库的命令行是开发/运维工具，按惯例带 -cli 后缀。
# 页面文案也跟着改名成了 site/pages/funread-cli.toml。
#
# 解开前这三件事要都成立（见 docs/package-spec.md）：
#   1. 有一个自带运行时的命令行入口，`funread-cli --version` 打得出版本号
#      —— brew test 的默认断言就是它，apt 那边的 verify 也跑这条；
#   2. release 附件按约定命名：`funread-cli_<版本>_{amd64,arm64}.deb`，以及
#      `funread-cli-<target>.tar.gz`（四个 target 见规范，里面是单个可执行文件）；
#   3. 同一次 release 里有一份覆盖所有附件的 SHA256SUMS。
#
# 到位之后跑一遍 `python3 scripts/sitedata.py packages.toml --check funread-cli`，
# 报告里没有 `!` 再解开。
#
# [[source]]
# repo = "farfarfun/funread"
# name = "funread-cli"
# keep = 3
#
# [source.brew]
# desc = "Manage Legado book sources and RSS feeds: parse, validate and batch process"
# # brew test 的额外断言。--help 不碰网络也不读配置，是这个库唯一能空跑的入口。
# checks = [["--help", "funread-cli"]]
# ---------------------------------------------------------------------------------------
# uTools 插件。仓库在 farfarfun-utools 那个组织下，不在 farfarfun 下 —— repo 写全名就行，
# 这张表本来就不假设是同一个组织。
#
# 四个插件共同的事实，不在每一节里重复：产物是一个 `.upx`（其实就是个 zip，根目录放
# plugin.json），三个桌面系统共用同一个文件，装法是拖进 uTools 窗口；数据都存在 uTools
# 自己的 dbStorage 里。keep 对它们只影响页面上「版本」那一节列几行 —— 插件的包不进
# APT pool，不占 Pages 那 1 GB。
# ---------------------------------------------------------------------------------------

[[source]]
repo = "farfarfun-utools/utools-funotp"
keep = 3

[source.utools]
# 插件在 uTools 里的名字，就是 plugin.json 的 pluginName。和包名不一样是常态：包名是
# 仓库名（utools-funotp），而用户在 uTools 里看到和搜到的是这个。
app = "两步验证 FunOTP"
# 英文一句话简介。和 brew 的 desc 同一个用法：页面上没写标语时拿它顶上。
desc = "Manage two-factor accounts locally and generate TOTP / HOTP codes offline"
# 上架了 uTools 的「插件应用市场」就改成 true，页面上会多一条从商店装的说明。四个插件
# 现在都还没上架，所以都不写 —— 写了等于在页面上许一个兑现不了的承诺。

[[source]]
repo = "farfarfun-utools/utools-funlink"
keep = 3

[source.utools]
app = "网址收藏 FunLink"
desc = "Collect, categorise and search your bookmarks, and open them in the browser you pick"

[[source]]
repo = "farfarfun-utools/utools-funchat"
keep = 3

[source.utools]
app = "好友聊天 FunChat"
desc = "Chat with multiple AI personas in uTools, with a built-in character market and exportable topics"

[[source]]
repo = "farfarfun-utools/utools-fundoc"
keep = 3

[source.utools]
app = "文档笔记 FunDoc"
desc = "Local Markdown notes with LaTeX formulas, a multi-level outline and cross-device sync"
