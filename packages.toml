# 收进 farfarfun 包仓库的项目。
#
# 每个条目是一个 GitHub 仓库。它 release 附件里的 `.deb` 会被编进 APT 索引，带
# `[source.brew]` 的还会生成一份 Homebrew formula、带 `[source.cask]` 的生成一份
# cask，都提交回本仓库的 Formula/ 和 Casks/（这个仓库同时就是 tap）。加一个新项目
# 就是在这儿加几行，项目仓库本身不用动 —— CI 的几个装机验证也是按这张表遍历的，
# 不用回去改 workflow。
#
# 附件名按约定认，包名取仓库名：
#   formula  `<包名>-<target>.tar.gz`
#   cask     `<应用名>-<版本>-macos-<架构>.dmg`（前缀是显示名，见下面 funclash）
#   apt      `<包名>_<版本>_<架构>.deb`
# 各项目的 release workflow 本来就是一个模子出来的，不再单独配一遍。
#
# 为什么不把 .deb 提交进 git：GitHub Pages 的站点上限是 1 GB，而二进制只增不减，
# 真到了那天想清理得改写历史。各项目的 Release 本来就是事实来源，这里只记
# 「收谁的、留几版」，pool 每次按这张表重新拼。

[[source]]
repo = "farfarfun/fundeploy"
# 索引里保留最近几个版本。留多于一个是为了能 `apt install fundeploy=0.3.0`
# 回退——只留最新的话，装坏了就没有退路。
keep = 3
# 0.3.0 之前是 Bash 版，deb 是 Architecture: all 并且 Depends 一堆东西，装出来是
# 一棵脚本树而不是一个二进制——跟现在是两个完全不同的东西，不该在同一个包名下
# 让人 `apt install fundeploy=0.1.17` 装到。0.1.15 那一版包名还叫 nltdeploy，
# 收进来等于凭空多出一个谁也不认识的包。
min_version = "0.3.0"

# 有这一节才生成 formula。desc 用英文：brew 那边搜索和 `brew desc` 都读它。
[source.brew]
desc = "Manage development toolchains, local services and package mirrors from one CLI"
# brew test 跑的额外断言：`[参数, 输出里该出现的字串]`。
# `--version` 对版本号的断言是默认就有的，不用写在这儿。
# 断言的是分节标题而不是某个具体服务名：服务清单会增减，标题不会。原来写的是
# 英文 `service`，而 `fundeploy list` 打的是中文 —— 那条断言从来没通过过，只是
# 在 verify-brew 开始跑 brew test 之前没人执行它。
checks = [["list", "服务"]]

[[source]]
repo = "farfarfun/funget"
keep = 3
# 1.1.72 及更早的 release 里没有 .deb（那时还没做这条渠道）。collect-debs.sh 对
# 「没有 .deb」是容忍的，写下限只是为了别让 keep=3 把名额占在没有包的版本上。
min_version = "1.1.73"

[source.brew]
desc = "HTTP file transfer tool with ranged concurrency and resume"
# --help 里有 download 这个子命令。funget 没有 fundeploy 那种能空跑的子命令：
# download / upload / info 全要一个真 URL，不该让 brew test 依赖网络。
checks = [["--help", "download"]]

[[source]]
repo = "farfarfun/funclash"
# 一个 .deb 45 MB，两个架构，所以 keep=2 就占了 180 MB，而 Pages 整站上限 1 GB。
# 留两版而不是三版：能回退是留多版的全部理由，两版就够用，第三版只是再占 90 MB。
# funclash 自己的 README 也是按「apt 保留最近两版」写给用户的。
keep = 2
# 改名前的 tag（v0.9.0 及更早）万一被推回这个仓库，那些 release 里的 .deb 叫
# `FlClash-<版本>-linux-<架构>.deb`，而 dpkg-scanpackages 的 glob 只认
# `<包名>_<版本>_<架构>.deb` —— 它扫不到却一声不响，然后 build-deb-repo.sh 的
# 条数核对会判整个组织的发布失败。写个下限把那些 tag 挡在外面。
min_version = "1.0.0"
# 没有能在 CI 里跑的命令行入口。postinst 往 /usr/bin 软链的 FunClash 是 Flutter
# 的窗口程序，它的 main() 只把 argv 交给 URL scheme 处理（funclash 的
# lib/main.dart），不认 --version，在无头 runner 上跑它只会卡住。verify 对
# cli = false 的包改成查 .desktop 的 Exec 解析得到、版本从 dpkg 问。
cli = false

# cask 而不是 [source.brew]：render-formula.py 的 bin.install 要一个
# `<包名>-<target>.tar.gz` 里的单个二进制，而这是个发 DMG 的桌面应用，没有那个
# 东西。两种产物由两个渲染器分别生成，见 scripts/render-cask.py 的头注释。
[source.cask]
# 应用的显示名：既是 DMG 附件名的前缀，也是装进 /Applications 的 .app 名。跟包名
# 不一样 —— 包名必须是小写的 funclash（Debian 对 package_name 的要求），而应用
# 在所有可见的地方都叫 FunClash。
app = "FunClash"
desc = "Multi-platform proxy client based on mihomo (Clash.Meta)"
# funclash 的 README 写的是 macOS 12 及以上。
min_macos = "monterey"
# brew uninstall --zap 要清的用户数据按这个 bundle id 拼。应用没开沙箱
# （macos/Runner/Release.entitlements 里没有 app-sandbox），所以数据直接落在
# ~/Library 下，不在 Containers 里。macOS 上没有常驻的特权 helper 要清：提权走的
# 是一次性的 osascript "with administrator privileges"，不装 launchd daemon。
bundle_id = "com.farfarfun.funclash"

# ⚠️ 这一节还不能合进 master。funread 今天是个纯 Python 库（PyPI 上的 funread，
# pyproject.toml 里没有 [project.scripts]），GitHub 上一个 release 都没有 —— 现在
# 收进来的话，verify 按这张表遍历跑 `apt install funread` 会找不到候选，整次构建红，
# 而且定时构建两小时红一次。
#
# 合并前这三件事要都成立（见 docs/package-spec.md）：
#   1. funread 有一个自带运行时的命令行入口，`funread --version` 打得出版本号
#      —— brew test 的默认断言就是它，apt 那边的 verify 也跑这条；
#   2. release 附件按约定命名：`funread_<版本>_{amd64,arm64}.deb`，以及
#      `funread-<target>.tar.gz`（四个 target 见规范，里面是单个可执行文件）；
#   3. 同一次 release 里有一份覆盖所有附件的 SHA256SUMS。
#
# 到位之后跑一遍 `python3 scripts/sitedata.py packages.toml --check funread`，
# 报告里没有 `!` 再合。
[[source]]
repo = "farfarfun/funread"
keep = 3

[source.brew]
desc = "Manage Legado book sources and RSS feeds: parse, validate and batch process"
# brew test 的额外断言。--help 不碰网络也不读配置，是这个库唯一能空跑的入口。
checks = [["--help", "funread"]]
