# funread 桌面客户端的包页文案。格式见 docs/package-spec.md。
#
# 这一份对应 farfarfun/funread-web 打出来的桌面应用（deb / DMG），不是 PyPI 上
# 那个同名的 Python 库 —— 后者的文案在 funread-cli.toml，包名也已经改叫
# funread-cli 了。

tagline.zh = "自托管的小说与订阅阅读客户端：连你自己那台服务器，断网也能接着读。"
tagline.en = "A self-hosted reader for novels and RSS feeds: connects to your own server, keeps reading offline."

description.zh = "funread 是自托管的阅读客户端，没有官方服务器 —— 第一次打开时填你自己那台 funread 服务器的地址和账号，客户端会换一条可随时吊销的设备 token 存在本机。它读 Legado 格式的书源，RSS 订阅在同一个应用里；看过的章节缓存在本地，断网不影响翻页。macOS、Linux、Windows 和 Android 都有。"
description.en = "funread is a self-hosted reading client with no official server: on first launch you point it at your own funread server, and it trades your password for a revocable device token kept on the machine. It reads Legado-format book sources, carries RSS feeds in the same app, and caches the chapters you have opened so losing the network does not stop you. Available for macOS, Linux, Windows and Android."

[[features]]
title.zh = "自托管"
title.en = "Self-hosted"
text.zh = "没有官方服务器，书和进度都在你自己那台机器上。"
text.en = "No official server — your books and progress stay on your own machine."

[[features]]
title.zh = "书源与订阅"
title.en = "Sources and feeds"
text.zh = "读 Legado 格式的书源，RSS 订阅在同一个应用里。"
text.en = "Reads Legado-format book sources, with RSS feeds in the same app."

[[features]]
title.zh = "断网接着读"
title.en = "Reads offline"
text.zh = "翻开过的章节留在本机，地铁里没信号也能往下看。"
text.en = "Chapters you have opened stay on the device, so a dead signal does not stop you."

[[features]]
title.zh = "一台设备一条凭据"
title.en = "One token per device"
text.zh = "存的是设备 token 不是密码，手机丢了在别的设备上就能吊销。"
text.en = "It stores a device token rather than your password, so a lost phone can be revoked from anywhere else."

# apt / brew 之外的渠道。funread light 是同一个仓库的另一套壳：不打包 Web 资源，
# 启动时问服务器地址，然后把整个窗口交给那台服务器上的页面 —— 登录态和离线缓存
# 跟在浏览器里打开同一个地址完全一样，代价是启动要有网。
#
# 它的 .deb 跟着主包一起进了 APT 源（Package 字段是 funread-light），所以这条命令
# 是真能跑的。但它在 packages.toml 里没有自己的条目（那张表一个仓库只能有一个），
# 因此没有独立页面、没有 cask —— macOS 和 Windows 的安装包只能去 Release 下。
[[install]]
id = "light"
title = "funread light"
cmd = "sudo apt install funread-light"
note.zh = "同一个仓库的薄壳版，不内置 Web 资源。加过源之后装，仅 Linux。"
note.en = "The thin-shell build from the same repo, with no bundled web assets. Linux only, after adding the source."
os = "linux"
