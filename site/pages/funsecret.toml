# funsecret 的包页文案。格式见 docs/package-spec.md。

tagline.zh = "本地优先的加密密钥管理工具：多级分类管理，原生支持 SQLite3、MySQL 与 PostgreSQL 同步。"
tagline.en = "Local-first encrypted secret manager CLI with multi-level paths and SQLite3, MySQL & PostgreSQL sync."

description.zh = "funsecret 是一个本地优先的加密密钥管理工具，默认以 2–5 级分类路径加密保存在本机 SQLite3 数据库（权限 0600）。核心与命令行均由 Rust 实现，静态二进制零依赖、毫秒级启动，同时提供零依赖 PyO3 Python 扩展，并支持 SQLite3 / MySQL / PostgreSQL 跨库迁移。"
description.en = "funsecret is a local-first encrypted secret manager storing credentials under 2–5 level category paths in an owner-only local SQLite3 database. Its core and CLI are written in Rust as a zero-dependency static binary, alongside a zero-dependency PyO3 Python package and native sync across SQLite3, MySQL and PostgreSQL."

[[features]]
title.zh = "多级路径，安全落盘"
title.en = "Hierarchical & local-first"
text.zh = "按 2–5 级分类路径组织账号密码、API Key 与连接串，Fernet 加密保存在本机 0600 SQLite3 库中。"
text.en = "Organises passwords, API keys and connection strings under 2–5 level paths with Fernet encryption in a 0600 local SQLite3 database."

[[features]]
title.zh = "三库无缝迁移"
title.en = "SQLite3, MySQL & PostgreSQL"
text.zh = "原生支持 SQLite3、MySQL（含 MariaDB）与 PostgreSQL 双向同步，自动兼容 SQLAlchemy 风格方言 URL 前缀。"
text.en = "Syncs bidirectionally across SQLite3, MySQL/MariaDB and PostgreSQL while accepting SQLAlchemy-style dialect URLs."

[[features]]
title.zh = "安全写入与结构化输出"
title.en = "Safe stdin & JSON output"
text.zh = "支持 write --stdin（密钥不进入进程参数）、--expire 过期时间、单条 delete 以及全子命令 --json 输出。"
text.en = "Supports write --stdin so secrets never appear in argv, optional --expire TTL, single-key delete, and --json output across subcommands."

[[features]]
title.zh = "独立二进制 + Python 扩展"
title.en = "Native binary & Python API"
text.zh = "命令行可零 Python 环境独立运行，pip 安装也同时包含零依赖 Python API 与同一套 Rust 引擎驱动的命令入口。"
text.en = "Runs as a standalone static binary without Python, while pip installs both the zero-dependency Python API and the same Rust-backed CLI."

[[install]]
id = "cargo"
title = "Cargo"
cmd = "cargo install funsecret"
note.zh = "有 Rust 工具链时直接从 crates.io 安装。"
note.en = "Install directly from crates.io with a Rust toolchain."

[[install]]
id = "pip"
title = "pip"
cmd = "pip install -U funsecret"
note.zh = "同时安装零依赖 Python API 与 Rust 引擎驱动的 funsecret 命令，老版本可无感升级。"
note.en = "Installs both the zero-dependency Python API and the Rust-backed funsecret CLI for seamless upgrades."
