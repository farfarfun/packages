tagline.zh = "随时呼出，即刻行动。Rust 驱动的本地桌面启动器与工具箱。"
tagline.en = "A shortcut away from your apps and tools. A local-first desktop launcher powered by Rust."

description.zh = "funtools 支持 Linux、Windows 和 macOS，提供全局快捷呼出、应用搜索启动、收藏、剪贴板历史，以及计算器、JSON、Base64 和时间戳工具。无需账号，数据保存在本地。"
description.en = "funtools brings global shortcuts, application search and launch, favorites, clipboard history, and calculator, JSON, Base64 and timestamp tools to Linux, Windows and macOS. No account required; data stays local."

[[features]]
title.zh = "快捷启动"
title.en = "Quick launch"
text.zh = "按快捷键呼出，搜索应用与工具，回车执行。支持收藏和使用次数排序。"
text.en = "Open with a global shortcut, search apps and tools, then press Enter. Pin favorites and sort by usage."

[[features]]
title.zh = "常用工具"
title.en = "Everyday tools"
text.zh = "计算器、JSON 格式化与校验、Base64 编解码、时间戳转换，都在同一个窗口里。"
text.en = "Calculator, JSON formatting and validation, Base64 encoding and decoding, and timestamp conversion in one window."

[[features]]
title.zh = "本地优先"
title.en = "Local first"
text.zh = "无需登录。剪贴板历史默认关闭，开启后仅保留在内存中，退出即清空。"
text.en = "No login. Clipboard history is opt-in, stays in memory and is cleared when the app exits."

[[features]]
title.zh = "多平台分发"
title.en = "Cross-platform packages"
text.zh = "提供 Linux x64 / ARM64、Windows x64，以及 Apple Silicon / Intel Mac 安装包。"
text.en = "Installers for Linux x64 and ARM64, Windows x64, and Apple Silicon and Intel Macs."
