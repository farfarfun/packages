name.zh = "算有所得"
name.en = "FunCalc"

tagline.zh = "计算有迹可循，让每一次推算都有所得。"
tagline.en = "A calculation notebook that keeps your work, variables and results together."

description.zh = "算有所得 FunCalc 是一款离线 uTools 计算笔记本，支持十进制运算、变量、向量、矩阵与 LaTeX 排版。计算历史和变量一起保存在本机，可搜索、复制、复用并导出 JSON，支持浅色、深色与跟随系统主题。"
description.en = "FunCalc is an offline uTools calculation notebook with decimal arithmetic, variables, vectors, matrices and LaTeX rendering. History and variables are saved together locally, with search, copying, reuse and JSON export. Choose light, dark or system appearance."

[[features]]
title.zh = "计算留下过程"
title.en = "Keep your calculations"
text.zh = "输入表达式预览公式，回车计算并保留当时的结果。搜索历史、点击复用，修改变量不会改写旧答案。"
text.en = "Preview expressions as formulas, then press Enter to calculate and save a snapshot. Search and reuse past expressions; changing a variable never rewrites earlier answers."

[[features]]
title.zh = "变量与矩阵"
title.en = "Variables and matrices"
text.zh = "复用命名变量与上次结果 ans，支持矩阵乘法、转置、行列式和逆矩阵，结果用数学排版清晰呈现。"
text.en = "Reuse named variables and the previous result, ans. Calculate matrix products, transposes, determinants and inverses, with clearly typeset results."

[[features]]
title.zh = "历史在本机"
title.en = "History stays local"
text.zh = "历史和变量保存在本机 IndexedDB，不自动清理；支持导出 JSON 存档。运行时不联网，清除插件数据前请先导出。"
text.en = "History and variables are stored in local IndexedDB without automatic deletion. Export a JSON archive before clearing plugin data. No network connection is required at runtime."

[[features]]
title.zh = "随手唤起"
title.en = "Ready from uTools"
text.zh = "输入「算有所得」或原有 FunCalc 关键词打开，也可选中表达式后调用计算。保留键盘操作，支持日夜主题与窄屏布局。"
text.en = "Launch from uTools using FunCalc or its new Chinese name, or pass a selected expression into the notebook. Keyboard controls, light and dark themes and a compact layout are included."

[[shots]]
light = "https://raw.githubusercontent.com/farfarfun-utools/utools-funcalc/master/docs/screenshots/light.png"
dark = "https://raw.githubusercontent.com/farfarfun-utools/utools-funcalc/master/docs/screenshots/dark.png"
alt.zh = "算有所得的计算历史、矩阵结果与变量侧栏"
alt.en = "FunCalc calculation history, matrix results and variables"
caption.zh = "表达式、计算结果与变量同屏呈现，历史可以搜索与复用。截图由 GitHub Actions 生成。"
caption.en = "Expressions, results and variables together, with searchable, reusable history. Screenshots are generated by GitHub Actions."

[[install]]
id = "source"
title = "源码构建 / Source"
cmd = "git clone https://github.com/farfarfun-utools/utools-funcalc.git\ncd utools-funcalc\nsh build.sh"
note.zh = "需要 Node.js ≥ 22.22.2 和 pnpm 12。构建后在 uTools 开发者工具中载入 utools/plugin.json。直接安装请下载本页的 .upxs 正式安装包，拖入 uTools，无需构建或解压。"
note.en = "Requires Node.js 22.22.2 or newer and pnpm 12. Build, then load utools/plugin.json in uTools developer tools. To install directly, download the stable .upxs package on this page and drag it into uTools; no build or extraction is needed."
