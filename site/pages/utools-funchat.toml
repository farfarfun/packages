# utools-funchat 的包页文案。格式见 docs/package-spec.md。

name.zh = "言来语往"
name.en = "FunChat"

tagline.zh = "把一屋子 AI 好友装进 uTools：多角色切换、内置角色市场、话题回溯、一键导出。"
tagline.en = "A room full of AI friends inside uTools — switch personas, pick from the built-in market, revisit past topics and export in one click."

description.zh = "言来语往 FunChat 是一个 uTools 插件，每个「AI 好友」是一套独立的角色设定、模型参数和聊天记录。内置 300 个开箱即用的角色，支持 uTools 内置 AI 和任意 OpenAI 兼容接口，会话和配置默认存在本机。"
description.en = "FunChat is a uTools plugin where each “AI friend” carries its own persona, model settings and history. It ships with 300 ready-made characters, works with the built-in uTools AI or any OpenAI-compatible endpoint, and keeps conversations and settings on your machine by default."

[[features]]
title.zh = "一人一套设定"
title.en = "One persona each"
text.zh = "每个好友有自己的提示词、模型、上下文长度和历史记录，Shift + ↓ 换人。"
text.en = "Every friend has its own prompt, model, context length and history; Shift + ↓ switches."

[[features]]
title.zh = "内置 300 个角色"
title.en = "300 built-in characters"
text.zh = "润色、审代码、写正则、调 SQL、模拟面试，点一下「添加并开始」就能用。"
text.en = "Polishing, code review, regexes, SQL, mock interviews — one click to add and start."

[[features]]
title.zh = "划词提问"
title.en = "Ask about a selection"
text.zh = "在别处选中文字再呼出 uTools，多一条「问 AI 好友」，内容预填进输入框。"
text.en = "Select text anywhere, call up uTools, and “Ask an AI friend” prefills it into the input box."

[[features]]
title.zh = "话题存得住"
title.en = "Topics keep"
text.zh = "每个好友的历史话题独立存档，可收藏、可全文搜索，整段能导出 Markdown / HTML / PDF。"
text.en = "Each friend's topics are archived separately — bookmark them, search the full text, export to Markdown, HTML or PDF."

