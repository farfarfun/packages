[[install]]
id = "source"
title = "源码构建 / Source"
cmd = "git clone https://github.com/farfarfun-utools/utools-fundata.git\ncd utools-fundata\npnpm install\nsh build.sh"
note.zh = "需要 Node.js ≥ 22.22.2 和 pnpm。构建后在 uTools 开发者工具中载入 utools/plugin.json。直接安装请下载本页的 .upxs 正式安装包并拖入 uTools，无需构建或解压。"
note.en = "Requires Node.js 22.22.2 or newer and pnpm. Build and load utools/plugin.json in uTools developer tools. To install directly, download the stable .upxs package on this page and drag it into uTools; no build or extraction is needed."
