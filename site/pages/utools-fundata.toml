name.zh = "数形万变"
name.en = "FunData"

tagline.zh = "离线 10 合 1 开发者数据工具箱：格式互转、SQL、JWT、正则、Cron 与哈希一站搞定。"
tagline.en = "An offline 10-in-1 developer data studio for formats, SQL, JWT, regex, Cron and hashes."

description.zh = "数形万变 FunData 是一款完全离线的 uTools 开发者数据工具箱，集成 10 格式双向互转、6 方言 SQL 美化、Protobuf 安全重编号、编解码与多时区时间戳、JWT 验签签发、哈希/HMAC 与 UUID/密钥生成、正则实验室、Cron 解析预测、色值进制字节换算以及双行号文本对比。"
description.en = "FunData is a fully offline 10-in-1 uTools developer data studio covering 10-format conversion, 6-dialect SQL formatting, safe Protobuf renumbering, encoding and timezone timestamps, JWT verification and signing, hash/HMAC and UUID/key generation, a regex lab, Cron schedule analysis, colour/base/byte conversion and side-by-side text diff."

[[features]]
title.zh = "格式、SQL 与 Protobuf"
title.en = "Formats, SQL and Protobuf"
text.zh = "支持 JSON / JSON5 / YAML / TOML / XML / CSV / TSV / INI / NDJSON / URL Query 10 格式互转、6 方言 SQL 美化压缩与 Protobuf 安全重编号。"
text.en = "Convert across 10 formats (JSON, JSON5, YAML, TOML, XML, CSV, TSV, INI, NDJSON, URL Query), format or minify 6 SQL dialects and safely renumber Protobuf definitions."

[[features]]
title.zh = "编解码、JWT 与哈希密钥"
title.en = "Encoding, JWT and crypto helpers"
text.zh = "Base64 / URL / Unicode / HTML / Hex 编解码与 5 时区时间戳；大整数保真 JWT 解析与 Web Crypto HS256/384/512 验签签发；MD5 / SHA / HMAC 与 UUID / ULID / NanoID 批量生成。"
text.en = "Encode/decode Base64, URL, Unicode, HTML and Hex with multi-timezone timestamps; verify and sign HS256/384/512 JWTs with Web Crypto; compute MD5/SHA/HMAC and batch-generate UUIDs, ULIDs and NanoIDs."

[[features]]
title.zh = "正则、Cron 与单位换算"
title.en = "Regex, Cron and unit converters"
text.zh = "正则实时高亮、捕获组表与替换预览；5/6 位 Cron 中英语义解析与未来 10 次触发预测；颜色 WCAG 对比度、BigInt 多进制与 IEC/SI 字节换算。"
text.en = "Test regexes with live highlights, capture tables and replacement previews; parse 5/6-field Cron schedules with the next 10 runs; convert colours with WCAG checks, BigInt bases and IEC/SI byte units."

[[features]]
title.zh = "文本对比与高效导航"
title.en = "Text diff and fast navigation"
text.zh = "双行号并排文本对比与去重/排序/词频批处理；支持 ⌘K 快速跳转面板，选中常见文件或文本时自动识别并直达对应工具。"
text.en = "Compare text side by side with batch deduplication, sorting and frequency stats; jump anywhere with ⌘K or route selected text and files straight to the right tool."

[[features]]
title.zh = "完全离线与 5 个 AI 工具"
title.en = "Fully offline with 5 AI tools"
text.zh = "100% 本机运行，无账号无联网请求；注册 convert_data_format、decode_jwt、format_sql、parse_cron、compute_hash 五个纯本地 AI/MCP 工具。"
text.en = "Runs 100% offline with zero network calls, and registers five local AI/MCP tools: convert_data_format, decode_jwt, format_sql, parse_cron and compute_hash."

