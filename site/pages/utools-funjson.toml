caption.zh = "多标签代码编辑器、内置 JSONPath 查询栏与光标智能检视条，支持浅色 / 深色 / 跟随系统。"
caption.en = "Multi-tab code editor with inline JSONPath query bar and smart cursor inspector in light and dark modes."

[[shots]]
