alt.zh = "JSON工坊的递归嵌套表格视图"
alt.en = "FunJSON recursive nested table view"
caption.zh = "支持嵌套子表展开、列排序与筛选、JSONPath 面包屑与多格式表格导出。"
caption.en = "Expand nested subtables inline with column sorting, filtering, JSONPath breadcrumbs and multi-format export."

[[shots]]
light = "https://raw.githubusercontent.com/farfarfun-utools/utools-funjson/master/docs/screenshots/tree.png"
alt.zh = "JSON工坊的交互式树形视图"
alt.en = "FunJSON interactive tree view"
caption.zh = "树形节点支持关键字过滤、内联编辑、增删节点与一键复制 JSONPath。"
caption.en = "Filter tree nodes by keyword, edit values inline, add or remove entries and copy JSONPath in one click."

