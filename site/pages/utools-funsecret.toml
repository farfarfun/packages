alt.en = "Adding or editing a secret in FunSecret"
caption.zh = "2–5 级分类带已有前缀自动补全，支持随机密码生成、多行凭据与有效期设置，经 stdin 安全写入。"
caption.en = "2–5 level path inputs with prefix completion, random generator, multiline support and TTL, written safely over stdin."

[[shots]]
