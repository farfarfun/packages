alt.en = "FunSecret in dark mode with timed inline reveal"
caption.zh = "支持浅色 / 深色 / 跟随系统；点击「查看」按需解密临时展示，到期自动隐藏。"
caption.en = "Light, dark or system theme; clicking Reveal decrypts on demand and automatically hides after a timeout."
