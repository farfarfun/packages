# utools-funsecret 的包页文案。格式见 docs/package-spec.md。

name.zh = "密藏随行"
name.en = "FunSecret"

tagline.zh = "基于原生 funsecret 命令行的 uTools 本地加密密钥管理：分类树浏览、主框直达复制、多库同步。"
tagline.en = "A uTools frontend for the native funsecret CLI: browse category trees, copy straight from the launcher, and sync across databases."

description.zh = "密藏随行 FunSecret 是一个 uTools 插件，底层直接调用本机 funsecret 命令行管理 2–5 级分类加密密钥。列表默认不读取也不展示明文，支持主搜索框快速匹配路径回车复制、剪贴板自动清空、临时明文查看、stdin 安全写入、TTL 有效期以及 SQLite3 / MySQL / PostgreSQL 外部同步。"
description.en = "FunSecret is a uTools plugin powered by the native funsecret CLI for managing 2–5 level encrypted secrets locally. Lists never read or display plaintext values; it supports launcher quick-copy, clipboard auto-clear, timed inline reveal, safe stdin writes, TTL expiration, and SQLite3 / MySQL / PostgreSQL sync."

[[features]]
title.zh = "密钥不进云同步"
title.en = "Secrets stay on your machine"
text.zh = "所有密钥仅保存在本机 funsecret 加密数据库（~/.secret/.funsecret.db），绝不写入 uTools dbStorage。"
text.en = "All secrets stay in your local funsecret database (~/.secret/.funsecret.db) and are never written to uTools cloud storage."

[[features]]
title.zh = "主框搜路径直达复制"
title.en = "Copy from the search box"
text.zh = "在 uTools 主搜索框直接输入分类关键词，回车按需读取并复制，支持倒计时自动清空剪贴板。"
text.en = "Type path keywords right in the uTools search bar, press Enter to read and copy on demand, with automatic clipboard clearing."

[[features]]
title.zh = "分类树与安全编辑"
title.en = "Category tree & safe editing"
text.zh = "按 2–5 级前缀自动分组与补全，支持多行/随机密码生成、stdin 安全写入、TTL 有效期与单条删除。"
text.en = "Auto-grouped 2–5 level tree with prefix completion, multiline/random secret generation, stdin writes, TTL expiry and single-item delete."

[[features]]
title.zh = "跨库迁移同步"
title.en = "Multi-database sync"
text.zh = "可视化调用 funsecret save / load，兼容 SQLite3、MySQL 与 PostgreSQL，支持自定义加密密钥 --cipher-key。"
text.en = "Visual wrapper for funsecret save / load across SQLite3, MySQL and PostgreSQL with optional --cipher-key encryption."

[[features]]
title.zh = "AI 仅看分类路径"
title.en = "Paths-only AI / MCP tool"
text.zh = "内置只读工具 list_secret_paths，仅返回分类路径与更新时间，绝不向任何 Agent 暴露密钥明文。"
text.en = "Registers a read-only list_secret_paths tool returning category paths and timestamps only — never secret values."

