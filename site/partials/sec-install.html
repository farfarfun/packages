    <section class="section wrap" id="install" aria-labelledby="install-title">
      <div class="rail-grid">
        <div class="rail">
          <p class="kicker" aria-hidden="true"><span class="cap"></span>{{num}}</p>
          <h2 id="install-title">{{t.installTitle}}</h2>
          <p class="section-sub">{{sub}}</p>
          <p class="rail-text">{{t.installLead}}</p>
          <p class="rail-links">
            <a href="{{home}}#setup">{{t.installSetupLink}}</a>
            <a href="{{repoUrl}}">{{t.pkgRepo}}</a>
          </p>
        </div>
{{%panes}}
      </div>
    </section>
