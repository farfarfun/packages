# 站点上所有看得见的文字。`[zh]` 和 `[en]` 必须有同一组键 —— render-site.py 启动时
# 对一遍，缺一个就报错退出，而不是在页面上留一句英文（或者一句 `{{t.foo}}`）。
#
# 带 `{}` 的是占位符，渲染器用 str.format 填。模板里引用成 `{{t.键名}}`，渲染器生成的
# 片段里用 `t("键名", 参数=…)`。JS 一个字文案都不存：要用的标签由渲染器写进 data-*，
# 所以这里的键涵盖了连「已复制」这种一闪而过的提示。

