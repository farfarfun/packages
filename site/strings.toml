# —— 首页 ——
homeTitle = "One source for every farfarfun package"
homePageTitle = "farfarfun packages — APT source and Homebrew tap"
homeDescription = "The APT source and Homebrew tap for farfarfun. Set it up once, then install any package in the organisation by its bare name with apt or brew, on amd64 and arm64."
homeLede = "The APT source and the Homebrew tap are the same repository. Set it up once; every package added later installs by its bare name."
homeEyebrow = "{count} packages · last updated {date}"
homeEyebrowBare = "{count} packages"
homeCtaSetup = "Set up the source"
homeCtaPackages = "See the packages"
fact1Title = "Signed index"
fact1 = "Every rebuild is re-signed with the same GPG key, and apt verifies it for you."
fact2Title = "amd64 and arm64"
fact2 = "Each architecture gets its own index, so a machine never sees a package it cannot install."
fact3Title = "Roll back"
fact3 = "The source keeps the last few versions of each package, so a bad upgrade has a way back."
fact4Title = "Gitee fallback"
fact4 = "When GitHub is unreachable, the Homebrew side can run entirely off the Gitee mirror."

setupTitle = "Set up"
setupSub = "Once is enough"
setupLead = "Run this once — the tab for your system is already selected. You never need it again, whatever you install later."
setupApt = "APT"
setupAptHint = "Debian, Ubuntu and derivatives"
setupBrew = "Homebrew"
setupBrewHint = "macOS and Linuxbrew"
setupGitee = "Gitee mirror"
setupGiteeHint = "When GitHub is unreachable"
setupKeys = "Signing key"
setupFingerprint = "Key fingerprint"
tipAptTitle = "What those three lines do"
tipApt = "The key lands in /usr/share/keyrings and the source file in /etc/apt/sources.list.d. The stable main at the end is this repository's only suite and component."
tipTapTitle = "The tap line needs the URL"
tipTap = "brew tap a/b only looks for a/homebrew-b, and this repository doubles as the APT source — naming it homebrew-packages would put the word homebrew in the middle of every apt URL."
tipTrustTitle = "The trust line is not optional"
tipTrust = "Since Homebrew 6.0 third-party taps are untrusted by default, and a bare name from an untrusted tap is refused outright. Trusting the whole tap means never doing this again per package."
tipGiteeTitle = "The mirror only replaces the tap step"
tipGitee = "Every url in the formulae has a Gitee mirror, so brew falls back on its own when downloading. Casks have no such route (a cask url takes no mirror), and neither does APT — the deb tree lives on Pages, not in git."

packagesTitle = "Packages"
packagesSub = "{count} of them"
packagesLead = "One page each: install commands, the versions still in the index, and the per-platform builds. Adding a package only touches packages.toml; these pages follow."
cardLatest = "Latest"
cardView = "Open the {name} page"
cardReleased = "Released {date}"
cardGui = "Desktop app"

howTitle = "How this repository runs"
howSub = "One manifest, three channels"
howLead = "Each project attaches its build output to its own GitHub Release. This repository collects them per packages.toml, rebuilds the index, signs it and publishes to Pages — and generates the Homebrew formulae and casks from the same manifest."
howFlowTitle = "One build"
howFlow = """packages.toml ──┬─► collect .deb → pool → scan index → sign → Pages → install check
                └─► render formula / cask → commit to master → mirror to Gitee → check"""
howTriggerTitle = "When it rebuilds"
howTrigger = "On a ping from a project that just shipped, on a change to packages.toml, by hand, and on a two-hourly scan — so a project that never pings is still picked up within two hours."
howMore = "The details are in the README"

